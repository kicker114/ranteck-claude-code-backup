name: Weekly Backup Release

on:
  schedule:
    # 每周日凌晨 3:00 UTC (北京时间 11:00)
    - cron: '0 3 * * 0'
  workflow_dispatch:
    # 手动触发按钮

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        id: date

      - name: Create backup archive
        run: |
          # 输出到 /tmp 避免打包时文件变化问题
          tar -czvf /tmp/backup-${{ steps.date.outputs.DATE }}.tar.gz \
            --exclude='.git' \
            --exclude='*.log' \
            .
          mv /tmp/backup-${{ steps.date.outputs.DATE }}.tar.gz .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: backup-${{ steps.date.outputs.DATE }}
          name: Weekly Backup ${{ steps.date.outputs.DATE }}
          files: backup-${{ steps.date.outputs.DATE }}.tar.gz
          body: |
            自动备份 release - ${{ steps.date.outputs.DATE }}

            包含内容：
            - settings.json 配置
            - skills/ 目录
            - projects/ 目录
            - 其他 Claude Code 配置文件

            恢复方法：
            ```bash
            tar -xzvf backup-${{ steps.date.outputs.DATE }}.tar.gz
            ```